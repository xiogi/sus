<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>小怪sus</title>
    <link rel="icon" href="img/tb.ico">
    <link rel="stylesheet" href="sus.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            background-color: black;
            font-family: "华文细黑", sans-serif;
        }

        .outermost {
            width: 100%;
            max-width: 1920px;
            min-width: 1280px;
            margin: 0 auto;
            height: 100%;
            overflow: hidden;
        }

        #content-area {
            display: none;
            padding: 40px;
            color: white;
            background-color: black;
            height: 100vh;
        }

        #content-area h2 {
            font-size: 2em;
            margin-bottom: 20px;
        }

        .back-btn {
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #a27300;
            color: black;
            border: none;
            cursor: pointer;
            font-size: 16px;
        }

        /* 小渔视频样式 */
        #full-screen-video {
            width: 100%;
            height: 100vh;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            z-index: -1;
        }

        #xxx2-content {
            position: relative;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
            z-index: 1;
        }
    </style>
</head>
<body>
<div class="outermost">
    <!--轮播图开始-->
    <div class="banner">
        <div class="nav">
            <div class="music-control">
                <img src="img/music-off.png" alt="音乐控制" class="music-icon">
            </div>
            <div class="nav-wrap">
                <div class="scroll-container">
                    <ul>
                        <li class="nav-active"><a href="javascript:void(0);" onclick="showHome()">首页</a></li>
                        <li class="has-dropdown">
                            <a href="javascript:void(0);" onclick="showContent('xiaogui-content')">小怪</a>
                        </li>
                        <li class="has-dropdown">
                            <a href="javascript:void(0);" onclick="showContent('kuaile-content')">kuaile</a>
                        </li>
                        <li class="has-dropdown">
                            <a href="javascript:void(0);" onclick="showContent('xxx2-content')">小渔</a>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
        <div class="banner-box">
            <div class="slider">
                <img src="img/001.png" alt="轮播图1" class="slide active">
                <img src="img/002.png" alt="轮播图2" class="slide">
                <img src="img/003.png" alt="轮播图3" class="slide">
                <img src="img/004.png" alt="轮播图4" class="slide">
            </div>
            <div class="slider-controls">
                <span class="dot active" data-index="0"></span>
                <span class="dot" data-index="1"></span>
                <span class="dot" data-index="2"></span>
                <span class="dot" data-index="3"></span>
            </div>
        </div>
    </div>
    <!--轮播图结束-->

    <!--内容区域开始-->
    <div id="content-area">
        <div id="xiaogui-content" style="display: none;">
            <h2>小怪专区</h2>
            <button class="back-btn" onclick="randomXiaoguiPic()">随机小怪照片</button>
            <div id="xiaogui-pic-box" style="margin:20px auto;max-width:400px;display:none;">
                <img id="xiaogui-img" src="" style="width:100%;border-radius:10px;">
            </div>

            <button class="back-btn" onclick="showHome()">返回首页</button>
        </div>
        <div id="kuaile-content" style="display: none;">
            <h2>kuaile：</h2>
            <p>小怪sus生日快乐啊🎂！不知道这个礼物🎁你是否会喜欢呢？</p>
            <p>本来是想给你做那个娃娃的，可能你都忘了，但是觉得你一定不会给我地址哈哈哈哈</p>
            <p>所以我就给你做了一个专属于你的网站！</p>
            <p>不爱开直播也就算了，还爱立flag！！！！</p>
            <p>玩数字炸弹吧，特意设置的8次机会呢😎</p>
            <button class="back-btn" onclick="goBomb()">去玩数字炸弹</button>

            <button class="back-btn" onclick="showHome()">返回首页</button>
        </div>
        <div id="xxx2-content" style="display: none;">
            <h2>小渔专出品</h2>
            <video id="full-screen-video" loop>
                <source src="img/小渔.mp4" type="video/mp4">
                您的浏览器不支持视频播放。
            </video>
            <button class="back-btn" onclick="showHome()">返回首页</button>
        </div>
    </div>
</div>

<audio id="background-music" loop>
    <source src="./img/生日快乐-4.MP3" type="audio/mpeg">
</audio>

<script>
    // 音乐控制
    const musicIcon = document.querySelector('.music-icon');
    const backgroundMusic = document.getElementById('background-music');
    backgroundMusic.pause();

    musicIcon.addEventListener('click', function () {
        if (backgroundMusic.paused) {
            backgroundMusic.play();
            musicIcon.src = "img/music.png";
        } else {
            backgroundMusic.pause();
            musicIcon.src = "img/music-off.png";
        }
    });

    // 轮播图功能
    let currentSlide = 0;
    const slides = document.querySelectorAll('.slide');
    const dots = document.querySelectorAll('.dot');
    const totalSlides = slides.length;

    function showSlide(index) {
        slides.forEach(slide => slide.classList.remove('active'));
        dots.forEach(dot => dot.classList.remove('active'));
        slides[index].classList.add('active');
        dots[index].classList.add('active');
        currentSlide = index;
    }

    function nextSlide() {
        currentSlide = (currentSlide + 1) % totalSlides;
        showSlide(currentSlide);
    }

    dots.forEach(dot => {
        dot.addEventListener('click', function () {
            const slideIndex = parseInt(this.getAttribute('data-index'));
            showSlide(slideIndex);
        });
    });
    /* 随机抽小鬼照片 */
    function randomXiaoguiPic() {
        const num = Math.floor(Math.random() * 17) + 1;
        const img = document.getElementById('xiaogui-img');
        img.src = `img/xiaogui/${String(num).padStart(2,'0')}.jpg`;
        document.getElementById('xiaogui-pic-box').style.display = 'block';
    }
    setInterval(nextSlide, 10000);

    // 页面内切换内容
    function showContent(id) {
        document.querySelector('.banner').style.display = 'none';
        const contentArea = document.getElementById('content-area');
        contentArea.style.display = 'block';
        contentArea.querySelectorAll('div').forEach(div => div.style.display = 'none');
        const contentDiv = document.getElementById(id);
        contentDiv.style.display = 'block';

        if (id === 'xxx2-content') {
            const video = document.getElementById('full-screen-video');
            video.play();
        }
    }

    function showHome() {
        document.querySelector('.banner').style.display = 'block';
        document.getElementById('content-area').style.display = 'none';

        const video = document.getElementById('full-screen-video');
        if (video) {
            video.pause();
            video.currentTime = 0; // 重置视频到开始位置
        }
    }
    // 页面内切换内容
    function showContent(id) {
        document.querySelector('.banner').style.display = 'none';
        const contentArea = document.getElementById('content-area');
        contentArea.style.display = 'block';
        contentArea.querySelectorAll('div').forEach(div => div.style.display = 'none');
        document.getElementById(id).style.display = 'block';

        if (id === 'xxx2-content') {
            const video = document.getElementById('full-screen-video');
            video.play();
        }
    }
    function goBomb() {
        window.location.href = 'http://localhost:63342/sus/xiaoguaisus.html?_ijt=eaoslh57d5j6j04d30ondvanbk&_ij_reload=RELOAD_ON_SAVE';
    }
</script>
</body>

</html>
